services:
  mongodb:
    image: 'mongo:7'
    environment:
      - 'MONGO_INITDB_DATABASE=gamerating'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27017:27017'
    volumes:
      - mongo_db:/data/db
      - ./init_db_script.js:/docker-entrypoint-initdb.d/init_db_script.js:ro

volumes:
  mongo_db:
